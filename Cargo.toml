[workspace]
resolver = "2"
members = [
    "programs/oxide",
    "programs/oxide_transfer_hook",
]

[workspace.dependencies]
anchor-lang = "=0.30.1"
anchor-spl  = "=0.30.1"

solana-program = "=1.18.26"

spl-token-2022 = { version = "=1.0.0", features = ["no-entrypoint"] }
spl-transfer-hook-interface = "=0.3.0"
spl-tlv-account-resolution = "=0.5.1"
spl-type-length-value = "=0.3.0"
spl-pod = "=0.2.5"

borsh = "=1.5.3"
borsh-derive = "=1.5.3"

toml = "=0.7.8"
toml_edit = "=0.19.15"
toml_datetime = "=0.6.5"

indexmap = "=2.1.0"


[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1


