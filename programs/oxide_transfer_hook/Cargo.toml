[package]
name = "oxide_transfer_hook"
version = "0.1.0"
edition = "2021"
description = "OXIDE Transfer Hook - Token-2022 Transfer Hook Extension"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
solana-program.workspace = true
spl-token-2022 = "=1.0.0"
spl-transfer-hook-interface = "=0.3.0"
spl-tlv-account-resolution.workspace = true
spl-type-length-value.workspace = true

borsh = "=1.5.3"
borsh-derive = "=1.5.3"
toml = "=0.7.8"
toml_edit = "=0.19.15"
toml_datetime = "=0.6.5"

indexmap = "=2.1.0"


[dev-dependencies]
solana-sdk = "=1.18.26"
solana-program-test = "=1.18.26"
